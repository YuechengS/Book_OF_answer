<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>答案之书</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 100%;
  height: 100vh;
  background: #0d0a1a;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: 'Noto Serif SC', serif;
  position: relative;
  overflow: hidden;
}
.bg-svg { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.top {
  position: relative;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 1.8rem;
}
.title { font-size: 11px; color: rgba(200,168,75,0.5); letter-spacing: 7px; margin-bottom: 0.5rem; }
.hint { font-size: 11px; color: rgba(180,130,80,0.4); letter-spacing: 2px; transition: opacity 0.5s; }
.random-btn {
  margin-top: 0.7rem;
  padding: 6px 20px;
  background: transparent;
  border: 1px solid rgba(180,130,80,0.35);
  color: rgba(180,130,80,0.7);
  border-radius: 20px;
  font-size: 10px;
  font-family: 'Noto Serif SC', serif;
  cursor: pointer;
  letter-spacing: 3px;
  transition: all 0.3s;
}
.random-btn:hover { background: rgba(180,130,80,0.08); }
.fan-area {
  position: absolute;
  bottom: -80px;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  height: 75vh;
  z-index: 3;
}
.card-wrap {
  position: absolute;
  width: 150px;
  height: 240px;
  bottom: 0;
  left: 50%;
  transform-origin: center bottom;
  cursor: pointer;
  transition: filter 0.4s;
  z-index: 2;
}
.card-wrap:hover { filter: brightness(1.2); z-index: 10; }
.card-inner {
  width: 100%;
  height: 100%;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 8px 32px rgba(0,0,0,0.7);
  transition: box-shadow 0.3s;
}
.card-wrap:hover .card-inner { box-shadow: 0 12px 44px rgba(180,130,80,0.4); }
.bark-bg {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(92deg, rgba(0,0,0,0.18) 0%, transparent 8%, rgba(0,0,0,0.12) 15%, transparent 22%, rgba(0,0,0,0.15) 35%, transparent 42%, rgba(0,0,0,0.1) 58%, transparent 65%, rgba(0,0,0,0.2) 78%, transparent 88%, rgba(0,0,0,0.1) 100%),
    linear-gradient(180deg, #6b4c2a 0%, #7d5a32 15%, #5c3d1e 30%, #8a6235 45%, #6b4c2a 60%, #7a5530 75%, #5a3a1a 90%, #6b4c2a 100%);
}
.bark-lines {
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(175deg, transparent 0px, transparent 6px, rgba(40,20,8,0.25) 6px, rgba(40,20,8,0.25) 7px, transparent 7px, transparent 14px, rgba(40,20,8,0.15) 14px, rgba(40,20,8,0.15) 15px),
    repeating-linear-gradient(183deg, transparent 0px, transparent 10px, rgba(140,100,50,0.12) 10px, rgba(140,100,50,0.12) 11px);
}
.bark-overlay {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 30% 40%, rgba(180,130,60,0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 70%, rgba(100,60,20,0.2) 0%, transparent 40%);
}
.bark-border {
  position: absolute;
  inset: 0;
  border-radius: 12px;
  border: 1.5px solid rgba(160,110,60,0.5);
}
.card-ornament {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 24px;
  color: rgba(220,180,100,0.35);
  pointer-events: none;
}
.card-wrap.dimmed {
  filter: brightness(0.3) saturate(0.2);
  cursor: default;
  pointer-events: none;
}
.revealed-card {
  position: fixed;
  width: 200px;
  height: 300px;
  background: #f5efe6;
  border: 2px solid #c4a882;
  border-radius: 16px;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1.8rem 1.4rem;
  text-align: center;
  box-shadow: 0 24px 70px rgba(0,0,0,0.7);
  z-index: 100;
  pointer-events: none;
  top: 46%;
  left: 50%;
  transform: translate(-50%, -50%);
}
.revealed-card.show {
  display: flex;
  animation: flyIn 0.55s cubic-bezier(0.2,0,0.1,1) forwards;
}
@keyframes flyIn {
  from { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
  to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}
.rev-label { font-size: 9px; color: #a07850; letter-spacing: 3px; opacity: 0.6; align-self: flex-start; margin-bottom: auto; }
.rev-quote { font-size: 18px; color: #3d2b1f; line-height: 1.9; flex: 1; display: flex; align-items: center; }
.rev-source { font-size: 10px; color: #a07850; letter-spacing: 1px; opacity: 0.7; align-self: flex-end; margin-top: auto; }
.again-btn {
  position: fixed;
  z-index: 110;
  padding: 8px 26px;
  background: rgba(13,10,26,0.9);
  border: 1px solid rgba(180,130,80,0.45);
  color: rgba(180,130,80,0.9);
  border-radius: 20px;
  font-size: 10px;
  font-family: 'Noto Serif SC', serif;
  cursor: pointer;
  letter-spacing: 3px;
  display: none;
  top: 76%;
  left: 50%;
  transform: translateX(-50%);
  transition: all 0.3s;
}
.again-btn:hover { background: rgba(30,20,10,0.95); }
</style>
</head>

<div class="top">
  <div class="title">答 案 之 书</div>
  <div class="hint" id="hint">选择你感应到的那张牌</div>
  <button class="random-btn" id="random-btn" onclick="pickRandom()">随 机 选 一 张</button>
</div>

<div class="fan-area" id="fan"></div>

<div class="revealed-card" id="revealed">
  <div class="rev-label">答案之书</div>
  <div class="rev-quote" id="rev-quote"></div>
  <div class="rev-source" id="rev-source"></div>
</div>

<button class="again-btn" id="again-btn" onclick="resetAll()">重 新 抽 牌</button>

<script>
let quotes = [];
const NUM = 7;
let picked = false;
let shuffled = [];

fetch('quotes.json')
  .then(r => r.json())
  .then(data => { quotes = data; renderFan(); });

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function renderFan() {
  const fan = document.getElementById('fan');
  fan.innerHTML = '';
  shuffled = shuffle(quotes).slice(0, NUM);
  picked = false;
  const angleRange = 58;
  const startAngle = -angleRange / 2;
  shuffled.forEach((q, i) => {
    const angle = startAngle + (angleRange / (NUM - 1)) * i;
    const wrap = document.createElement('div');
    wrap.className = 'card-wrap';
    wrap.id = `card-${i}`;
    wrap.style.transform = `translateX(-50%) rotate(${angle}deg)`;
    wrap.innerHTML = `
      <div class="card-inner">
        <div class="bark-bg"></div>
        <div class="bark-lines"></div>
        <div class="bark-overlay"></div>
        <div class="bark-border"></div>
        <div class="card-ornament">✦</div>
      </div>`;
    wrap.onclick = () => revealCard(i);
    fan.appendChild(wrap);
  });
  document.getElementById('revealed').classList.remove('show');
  document.getElementById('again-btn').style.display = 'none';
  document.getElementById('hint').style.opacity = '1';
  document.getElementById('random-btn').style.display = 'inline-block';
}

function revealCard(i) {
  if (picked) return;
  picked = true;
  document.querySelectorAll('.card-wrap').forEach((c, idx) => {
    if (idx !== i) c.classList.add('dimmed');
  });
  document.getElementById('hint').style.opacity = '0';
  document.getElementById('random-btn').style.display = 'none';
  const q = shuffled[i];
  document.getElementById('rev-quote').textContent = q.text;
  document.getElementById('rev-source').textContent = '—— ' + q.source;
  setTimeout(() => {
    document.getElementById('revealed').classList.add('show');
    setTimeout(() => {
      document.getElementById('again-btn').style.display = 'inline-block';
    }, 500);
  }, 100);
}

function pickRandom() {
  if (picked) return;
  revealCard(Math.floor(Math.random() * NUM));
}

function resetAll() { renderFan(); }
</script>
