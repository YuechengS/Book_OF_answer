<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  background: #0d0a1a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Serif SC', serif;
  overflow: hidden;
  position: relative;
}

.bg-svg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.top-right {
  position: fixed;
  top: 1.2rem;
  right: 1.5rem;
  z-index: 10;
}

.version-select {
  background: transparent;
  border: 1px solid rgba(180,130,80,0.35);
  color: rgba(180,130,80,0.7);
  font-family: 'Noto Serif SC', serif;
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 12px;
  cursor: pointer;
  letter-spacing: 1px;
  appearance: none;
  outline: none;
}

.version-select option { background: #1a1230; color: #b48250; }

.content {
  position: relative;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem;
  max-width: 480px;
  text-align: center;
}

.title {
  font-size: 12px;
  color: rgba(200,168,75,0.6);
  letter-spacing: 7px;
  margin-bottom: 2.5rem;
}

.divider {
  width: 100px;
  height: 1px;
  background: linear-gradient(to right, transparent, rgba(180,130,80,0.5), transparent);
  margin: 1.5rem 0;
}

.tagline {
  font-size: 15px;
  color: #e8d5b0;
  line-height: 2.2;
  min-height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.tagline-source {
  font-size: 10px;
  color: rgba(180,130,80,0.45);
  letter-spacing: 2px;
  margin-top: 0.6rem;
}

.start-btn {
  margin-top: 2.5rem;
  padding: 40px 144px;
  background: rgba(134, 184, 214, 0.372);
  border: 1px solid rgba(180,130,80,0.5);
  color: rgba(180,130,80,0.9);
  border-radius: 24px;
  font-size: 12px;
  font-family: 'Noto Serif SC', serif;
  cursor: pointer;
  letter-spacing: 4px;
  transition: all 0.3s;
  text-decoration: none;
  display: inline-block;
}

.start-btn:hover {
  background: rgba(180,130,80,0.1);
  border-color: rgba(180,130,80,0.8);
  color: #d4a060;
}
</style>
</head>

<script>
const quotes = [
  {text: "我有好多奢望。我想爱，想吃，还想在一瞬间变成天上半明半暗的云。", source: "王小波"},
  {text: "节日前的城市有股湿润的味道。", source: "最后的故事"},
  {text: "每一种被我们排斥的感情，都是一颗被我们熄灭的星星。", source: "黑塞"},
  {text: "于千万年之中，没有早一步，也没有晚一步。", source: "张爱玲·爱"},
  {text: "多年后，他还会记得那个下午，蝴蝶在窗外振翅的声音。", source: "马尔克斯·百年孤独"},
  {text: "不知曙光何时来，我打开每一扇窗。", source: "艾米丽·狄金森"},
];
const q = quotes[Math.floor(Math.random() * quotes.length)];
document.getElementById('tagline').textContent = q.text;
document.getElementById('tagline-source').textContent = '—— ' + q.source;
</script>
