<html lang="zh">

<meta charset="UTF-8">

<title>答案之书 · 指引</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  background: #0d0a1a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Serif SC', serif;
  overflow: hidden;
  position: relative;
}
.bg-svg { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.card {
  position: relative;
  z-index: 5;
  background: rgba(240,230,210,0.92);
  border-radius: 16px;
  padding: 2.5rem 2.8rem;
  max-width: 360px;
  width: calc(100% - 3rem);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.subtitle { font-size: 11px; color: #a07840; letter-spacing: 6px; margin-bottom: 2rem; }
.divider {
  width: 80px; height: 1px;
  background: linear-gradient(to right, transparent, rgba(160,120,64,0.4), transparent);
  margin: 1.5rem 0;
}
.steps { display: flex; flex-direction: column; gap: 1.6rem; text-align: left; width: 100%; }
.step { display: flex; gap: 1rem; align-items: flex-start; }
.step-num { font-size: 11px; color: #a07840; letter-spacing: 1px; min-width: 16px; padding-top: 3px; }
.step-text { font-size: 15px; color: #2a1f10; line-height: 1.8; }
.step-note { font-size: 12px; color: #7a5c30; margin-top: 0.3rem; line-height: 1.8; }
.continue-btn {
  margin-top: 2rem;
  padding: 10px 36px;
  background: transparent;
  border: 1px solid rgba(160,120,64,0.6);
  color: #7a5020;
  border-radius: 24px;
  font-size: 12px;
  font-family: 'Noto Serif SC', serif;
  cursor: pointer;
  letter-spacing: 4px;
  transition: all 0.3s;
  text-decoration: none;
  display: inline-block;
}
.continue-btn:hover { background: rgba(160,120,64,0.1); color: #5a3810; }
</style>
</head>

<div class="card">
  <div class="subtitle">使 用 指 引</div>
  <div class="divider"></div>
  <div class="steps">
    <div class="step">
      <div class="step-num">一</div>
      <div>
        <div class="step-text">默想你心中的问题</div>
        <div class="step-note">问题尽量简单直接，例如<br>「这条路能走得通吗？」「我应该离开吗？」</div>
      </div>
    </div>
    <div class="step">
      <div class="step-num">二</div>
      <div>
        <div class="step-text">闭上眼睛，默想问题三遍</div>
      </div>

      <div class="step-num">三</div>
